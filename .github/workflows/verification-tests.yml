name: Verification tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run scan:secrets
      - run: npm run audit:dependencies
      - run: npm run scan:sast
      - run: npm run scan:headers
      - run: npm run sbom
      - run: git diff --check
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: dar-b3-sbom-${{ github.sha }}
          path: evidence/sbom.cyclonedx.json
          if-no-files-found: error
