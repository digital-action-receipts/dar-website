<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Current DAR prototype data flow</title><desc id="desc">User data enters the playground, browser WebCrypto creates a key, localStorage persists it, a demo receipt is downloaded, and the placeholder verifier accepts local or remotely fetched JSON.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.b{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2}.w{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.n{fill:#fef2f2;stroke:#b91c1c;stroke-width:2}.t{font:16px Arial,sans-serif;fill:#0f172a}.s{font:13px Arial,sans-serif;fill:#475569}.l{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect class="w" x="40" y="50" width="185" height="80" rx="10"/><text class="t" x="132" y="82" text-anchor="middle">User input</text><text class="s" x="132" y="106" text-anchor="middle">untrusted JSON / URL</text>
  <rect class="b" x="300" y="50" width="200" height="80" rx="10"/><text class="t" x="400" y="82" text-anchor="middle">playground.html</text><text class="s" x="400" y="106" text-anchor="middle">browser-only</text><path class="l" d="M225 90 H300"/>
  <rect class="b" x="300" y="180" width="200" height="70" rx="10"/><text class="t" x="400" y="222" text-anchor="middle">Browser WebCrypto</text><path class="l" d="M400 180 V130"/>
  <rect class="w" x="575" y="40" width="205" height="100" rx="10"/><text class="t" x="677" y="75" text-anchor="middle">localStorage</text><text class="s" x="677" y="100" text-anchor="middle">extractable private +</text><text class="s" x="677" y="120" text-anchor="middle">public demo JWK</text><path class="l" d="M500 90 H575"/>
  <rect class="b" x="575" y="190" width="205" height="75" rx="10"/><text class="t" x="677" y="220" text-anchor="middle">Demo DAR JSON</text><text class="s" x="677" y="243" text-anchor="middle">SHA-256 + ECDSA</text><path class="l" d="M500 110 L575 210"/>
  <rect class="b" x="855" y="190" width="205" height="75" rx="10"/><text class="t" x="957" y="235" text-anchor="middle">Customer file</text><path class="l" d="M780 227 H855"/>
  <rect class="w" x="855" y="330" width="205" height="85" rx="10"/><text class="t" x="957" y="365" text-anchor="middle">verifier.html</text><text class="s" x="957" y="389" text-anchor="middle">placeholder heuristic</text><path class="l" d="M957 265 V330"/><path class="l" d="M190 130 L855 360"/>
  <rect class="w" x="575" y="330" width="205" height="85" rx="10"/><text class="t" x="677" y="365" text-anchor="middle">External origin</text><text class="s" x="677" y="389" text-anchor="middle">optional untrusted fetch</text><path class="l" d="M855 380 H780"/>
  <rect class="w" x="855" y="470" width="205" height="70" rx="10"/><text class="t" x="957" y="500" text-anchor="middle">Displayed result</text><text class="s" x="957" y="523" text-anchor="middle">not cryptographic proof</text><path class="l" d="M957 415 V470"/>
  <rect class="n" x="40" y="450" width="675" height="100" rx="10"/><text class="t" x="377" y="482" text-anchor="middle">No evidenced flow</text><text class="s" x="377" y="508" text-anchor="middle">authentication, server storage, logging, backups, retention, hold, archive,</text><text class="s" x="377" y="531" text-anchor="middle">managed export, authorized disposition, or disposition receipt</text>
</svg>
