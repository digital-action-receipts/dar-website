<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Current evidenced DAR architecture</title><desc id="desc">Static GitHub source, unknown hosting path, user browser pages, playground, placeholder verifier, user files, and optional external URL. Backend services are not evidenced.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.b{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2}.w{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.n{fill:#fef2f2;stroke:#b91c1c;stroke-width:2}.t{font:16px Arial,sans-serif;fill:#0f172a}.s{font:13px Arial,sans-serif;fill:#475569}.l{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect class="b" x="40" y="70" width="150" height="70" rx="10"/><text class="t" x="115" y="102" text-anchor="middle">Maintainer</text><text class="s" x="115" y="124" text-anchor="middle">commits</text>
  <rect class="b" x="260" y="55" width="220" height="100" rx="10"/><text class="t" x="370" y="92" text-anchor="middle">GitHub repository</text><text class="s" x="370" y="118" text-anchor="middle">static HTML / CSS / JS</text>
  <rect class="w" x="555" y="55" width="220" height="100" rx="10"/><text class="t" x="665" y="87" text-anchor="middle">Static host / CDN</text><text class="s" x="665" y="112" text-anchor="middle">DNS, TLS, provider and</text><text class="s" x="665" y="132" text-anchor="middle">deployment path unknown</text>
  <rect class="b" x="850" y="55" width="220" height="100" rx="10"/><text class="t" x="960" y="105" text-anchor="middle">User browser</text>
  <path class="l" d="M190 105 H260"/><path class="l" d="M480 105 H555" stroke-dasharray="7 5"/><path class="l" d="M775 105 H850"/>
  <rect class="b" x="805" y="215" width="180" height="75" rx="10"/><text class="t" x="895" y="248" text-anchor="middle">Informational pages</text>
  <rect class="w" x="560" y="215" width="190" height="90" rx="10"/><text class="t" x="655" y="245" text-anchor="middle">DAR playground</text><text class="s" x="655" y="269" text-anchor="middle">WebCrypto + localStorage</text><text class="s" x="655" y="289" text-anchor="middle">demo only</text>
  <rect class="w" x="1020" y="215" width="160" height="90" rx="10"/><text class="t" x="1100" y="245" text-anchor="middle">Verifier template</text><text class="s" x="1100" y="270" text-anchor="middle">placeholder checks</text>
  <path class="l" d="M930 155 L895 215"/><path class="l" d="M930 155 L655 215"/><path class="l" d="M985 155 L1100 215"/>
  <rect class="b" x="530" y="360" width="200" height="70" rx="10"/><text class="t" x="630" y="402" text-anchor="middle">User-controlled files</text><path class="l" d="M655 305 L630 360"/>
  <rect class="w" x="970" y="360" width="210" height="70" rx="10"/><text class="t" x="1075" y="392" text-anchor="middle">User-supplied URL</text><text class="s" x="1075" y="414" text-anchor="middle">optional remote fetch</text><path class="l" d="M1100 305 L1075 360"/>
  <rect class="n" x="40" y="370" width="410" height="95" rx="10"/><text class="t" x="245" y="400" text-anchor="middle">Not evidenced</text><text class="s" x="245" y="425" text-anchor="middle">backend, API, IdP, database, receipt store, KMS,</text><text class="s" x="245" y="448" text-anchor="middle">operational logs, backups, environments, or CI/CD</text>
</svg>
